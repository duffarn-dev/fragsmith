# Fragsmith — konfigurasjon
# Kopier denne fila til config.toml og fyll inn dine egne verdier.

[players]
# Dine Steam-kontoer (SteamID64). Pipelinen velger automatisk den som er i
# demoen; er flere med, velges den med høyest samlet hype-score.
# --player <steamid64> på kommandolinja overstyrer.
# Finn din SteamID64 f.eks. på https://steamid.io
known_players = [
    "76561190000000000",  # erstatt med din SteamID64
]

[music]
music_dir = 'C:\path\to\music'

[video]
width = 1920
height = 1080
framerate = 60

[render]
# SSH-transport: dev-PC-en sender jobber og henter klipp selv.
# La ssh_host stå tom hvis du ikke bruker SSH.
ssh_host = ""                 # f.eks. "bruker@192.168.1.50"
ssh_key = ""                  # f.eks. 'C:\Users\<deg>\.ssh\fragsmith_render'
remote_job_dir = "C:/fragsmith-jobs"

# Alternativ: delt mappe (SMB) eller lokal kø. Tom + tom ssh_host = manuell USB.
job_dir = ""

# P20: klipp med slow-mo (Director-segmenter, headshot-mikro eller replay)
# rendres i denne frameraten → ekte smooth nedbremsing uten interpolasjon.
# 120 dekker slow-mo ned til ~0.5×; 240 dekker 0.25× men dobler render-tid/
# disk for de klippene. 0 = av (alt rendres i [video].framerate).
highfps_framerate = 120

# P2: trueView gir riktig POV-kropp/armer i HLAE. UVERIFISERT på vår
# CS2-versjon — sjekk at crosshair/killfeed overlever på første render,
# noter utfallet i learnings_runtime.md. X-ray settes automatisk per klipp
# (ace/clutch/AWP) og har ikke eget flagg her.
true_view = true

[director]
model = "claude-opus-4-8"
max_retries = 3

[effects]
enabled = true
intensity = 1.2          # global styrke 0.0-2.0 (skalerer alt under)
grade = true             # fargegradering: kontrast, metning, skarphet
vignette = true          # mørkere hjørner
beat_zoom = true         # puls-zoom som dunker på beatene
beat_zoom_strength = 0.5 # 0.5 = diskré, 2.0 = aggressiv (1.4 kan føles "laggy")
flash_transitions = true # hvit blits inn i klipp (der Director valgte "cut")
wobble = false           # av: beat-synket risting kan føles urolig
kill_zoom = true         # dyp zoom inn på crosshair på siste kill i hvert klipp
kill_zoom_factor = 1.7   # hvor langt inn (1.7 = 70 %)
kill_tilt = true         # dutch tilt på filmens klimaks-kill (kombineres med kill_zoom)
kill_tilt_degrees = 22.0 # klampes automatisk så zoomen dekker svarte hjørner
intro_hook = true        # "cold open": 3 mikro-glimt av toppdrap før intro-kortet
slowmo_punch = true      # sakte push-in zoom under slow-mo-segmenter
eased_ramps = true       # myke hastighetsoverganger inn/ut av slow-mo (P3)
smooth_slowmo = true     # optical flow-interpolert slow-mo — jevnere, men tregere encode (P8)
letterbox_on_slowmo = true  # 2.35:1-bånd som glir inn på slow-mo/clutch-klimaks (P6)
lut = "assets/luts/fragsmith-teal-orange.cube"  # .cube-LUT, filmisk teal-orange (P5)
                         # generert av tools/make_lut.py — kjør det på nytt for å justere.
                         # Relativ sti ankres i prosjektmappa. Tom = av.
grain = 0.15             # film grain 0.0-1.0, 0 = av (P5)
freeze_on_finish = true  # freeze-frame på siste drap i ace/4k+ (P4)
freeze_seconds = 0.45    # hvor lenge bildet fryses
headshot_punch = true    # liten zoom-punch på headshots (P10) — siste kill dekkes av kill_zoom
headshot_punch_strength = 1.0  # 1.0 ≈ 1.18× zoom (skaleres også av intensity, tak 1.22×)
headshot_micro_slowmo = true   # kort 0.4×-øyeblikk rundt headshot-punchen (P10)
kill_counter = true      # teller 1→2→3→4K/ACE synket på hvert drap, klipp med 3+ kills (P11)
lowerthird = true        # diskret kontekstlinje nede til venstre: kart · runde · 1vX (P7)
animated_overlays = true # overlay-tekst glir opp + fader i stedet for hard på/av (P9)
impact_split = true      # 3 frames RGB-forskyvning på store drap — følger punch-utvalget (P12)
instant_replay = true    # P17+P19: klimaks-drapet spoles tilbake og vises i slow-mo fra
                         # offerets POV (krever ekstra render-sekvens — mer render-tid/disk)

[editing]
intro_seconds = 2.5
outro_seconds = 2.5
beat_tolerance_seconds = 0.75  # maks trimming for å treffe et beat
drop_sync = true               # P21: legg klimaks-klippet på musikkens bass-drop
                               # (intro-justering eller musikk-offset; spor uten
                               # tydelig drop faller tilbake til klimaks-til-slutt)
game_audio_volume = 0.25       # game-lyd under musikken (med sidechain_duck kan denne økes, f.eks. 0.5)
sidechain_duck = true          # duck game-lyd dynamisk etter musikkens nivå (P16)
sidechain_threshold = 0.05     # musikknivå der ducking slår inn
sidechain_ratio = 8.0          # hvor hardt det dukkes (høyere = mer)
sidechain_release_ms = 300     # hvor raskt game-lyden slipper opp igjen
stats_outro = true             # outro med K/K-D/HS%/beste clutch i stedet for bare tekst (P13)
sfx = true                     # whoosh inn mot klippbytter + impact på store drap (P15)
sfx_volume = 0.35              # SFX-nivå i miksen (impact får ×1.3)
sfx_dir = "assets/sfx"         # egne .wav-er her overstyrer; mangler de, syntetiseres de

[clips]
pre_kill_seconds = 5.0    # luft før første kill i et klipp
post_kill_seconds = 3.0   # luft etter siste kill
max_gap_seconds = 15.0    # kills nærmere enn dette klumpes i samme klipp
max_candidates = 25       # hard grense inn til AI Director
