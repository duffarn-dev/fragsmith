# Fragsmith configuration
# Copy this file to config.toml and fill in your own values.

[players]
# Your Steam accounts (SteamID64). The pipeline automatically picks the one
# that's in the demo; if several are, the one with the highest total hype
# score is picked. --player <steamid64> on the command line overrides it.
# Find your SteamID64 at e.g. https://steamid.io
known_players = [
    "76561190000000000",  # replace with your SteamID64
]

[music]
music_dir = 'C:\path\to\music'

[video]
width = 1920
height = 1080
framerate = 60

[render]
# Where the clips are rendered (rendering launches CS2 and takes over that PC):
#   "local"  = this PC (CS2 + CS Demo Manager installed here). Simplest.
#   "ssh"    = a separate render PC; jobs are sent over SSH automatically
#   "folder" = a separate render PC; jobs go through a shared folder (job_dir),
#              or by USB stick if job_dir is empty
# Two-PC setup: see docs/two-pc-setup.md. Check your setup: python main.py doctor
mode = "local"

# local: path to csdm.cmd. Empty = the default install location
# (%LOCALAPPDATA%\Programs\cs-demo-manager\csdm.cmd).
csdm_path = ""

# ssh: this PC sends jobs to the render PC and fetches the clips itself.
ssh_host = ""                 # e.g. "user@192.168.1.50" (privacy-check: ignore)
ssh_key = ""                  # e.g. 'C:\Users\<you>\.ssh\fragsmith_render'
remote_job_dir = "C:/fragsmith-jobs"

# folder: the shared folder (SMB) path. Empty = manual USB transfer.
job_dir = ""

# Clips with slow-mo (Director segments, headshot micro slow-mo or replay)
# are rendered at this frame rate → truly smooth slowdown without interpolation.
# 120 covers slow-mo down to ~0.5×; 240 covers 0.25× but doubles render time/
# disk for those clips. 0 = off (everything renders at [video].framerate).
highfps_framerate = 120

# trueView gives the correct POV body/arms in HLAE. UNVERIFIED on recent
# CS2 versions: check that the crosshair/killfeed survive on the first render
# and note the result in learnings_runtime.md. X-ray is set automatically per
# clip (ace/clutch/AWP) and has no flag of its own here.
true_view = true

[selftest]
# `python main.py selftest` uses the newest .dem/.dem.bz2 in this folder
# (subfolders included). It must be FRESH: recorded with the CS2 version the
# render PC runs. Leave empty to pass --demo every time.
demo_dir = ""

[director]
# Who makes the edit plan in step 3:
#   "auto"   = Claude if ANTHROPIC_API_KEY is set, otherwise the built-in rules
#   "claude" = always Claude (stops if the key is missing)
#   "rules"  = always the built-in rules (no API key, no cost, works offline)
# python main.py run --director rules|claude overrides this for one run.
mode = "auto"
model = "claude-opus-4-8"
max_retries = 3

[style]
# One word for a tuned set of effects:
#   "custom"    = [effects] and [editing] below, exactly as written
#   "clean"     = grade and beat cuts; no zooms, flashes, counters or sound effects
#   "hype"      = everything on and stronger
#   "cinematic" = letterbox, grain, slow pushes, long freezes, the instant replay
# A preset overrides only the switches it names (docs/effects.md lists them).
# python main.py run --style hype overrides this for one film.
preset = "custom"

[effects]
enabled = true
intensity = 1.2          # global strength 0.0-2.0 (scales everything below)
grade = true             # color grading: contrast, saturation, sharpness
vignette = true          # darker corners
beat_zoom = true         # pulse zoom that thumps on the beats
beat_zoom_strength = 0.5 # 0.5 = subtle, 2.0 = aggressive (1.4 can feel "laggy")
flash_transitions = true # white flash into clips (where the Director chose "cut")
wobble = false           # off: beat-synced shaking can feel restless
kill_zoom = true         # deep zoom into the crosshair on the last kill of each clip
kill_zoom_factor = 1.7   # how far in (1.7 = 70%)
kill_tilt = true         # dutch tilt on the film's climax kill (combined with kill_zoom)
kill_tilt_degrees = 22.0 # clamped automatically so the zoom covers the black corners
intro_hook = true        # "cold open": 3 micro glimpses of top kills before the intro card
slowmo_punch = true      # slow push-in zoom during slow-mo segments
eased_ramps = true       # smooth speed transitions into/out of slow-mo
smooth_slowmo = true     # optical flow interpolated slow-mo: smoother, but slower encode
letterbox_on_slowmo = true  # 2.35:1 bar that slides in on slow-mo/clutch climaxes
lut = "assets/luts/fragsmith-teal-orange.cube"  # .cube LUT, filmic teal-orange
                         # generated by tools/make_lut.py; run it again to adjust.
                         # A relative path is anchored in the project folder. Empty = off.
grain = 0.15             # film grain 0.0-1.0, 0 = off
freeze_on_finish = true  # freeze frame on the last kill of an ace/4k+
freeze_seconds = 0.45    # how long the image is frozen
headshot_punch = true    # small zoom punch on headshots; the last kill is covered by kill_zoom
headshot_punch_strength = 1.0  # 1.0 ≈ 1.18× zoom (also scaled by intensity, capped at 1.22×)
headshot_micro_slowmo = true   # short 0.4× moment around the headshot punch
kill_counter = true      # counter 1→2→3→4K/ACE synced to each kill, clips with 3+ kills
lowerthird = true        # subtle context line in the bottom left: map · round · 1vX
animated_overlays = true # overlay text slides up + fades instead of a hard on/off
impact_split = true      # 3 frames of color shift on big kills; follows the punch selection
instant_replay = true    # the climax kill is rewound and shown in slow-mo from the
                         # victim's POV (needs an extra render pass: more render time/disk)

[editing]
intro_seconds = 2.5
outro_seconds = 2.5
beat_tolerance_seconds = 0.75  # max trimming to hit a beat
drop_sync = true               # place the climax clip on the music's bass drop
                               # (intro adjustment or music offset; tracks without
                               # a clear drop fall back to climax-at-the-end)
game_audio_volume = 0.25       # game audio under the music (with sidechain_duck this can go higher, e.g. 0.5)
sidechain_duck = true          # duck game audio dynamically by the music's level
sidechain_threshold = 0.05     # music level where ducking kicks in
sidechain_ratio = 8.0          # how hard it ducks (higher = more)
sidechain_release_ms = 300     # how fast the game audio comes back up
stats_outro = true             # outro with kills/K-D/HS%/best clutch instead of just text
thumbnail = true               # thumbnail.jpg (1280x720) of the climax kill next to final.mp4
sfx = true                     # whoosh into clip changes + impact on big kills
sfx_volume = 0.35              # SFX level in the mix (impact gets ×1.3)
sfx_dir = "assets/sfx"         # your own .wav files here override; if missing, they're synthesized

[branding]
# Your own look. Paths are relative to the Fragsmith folder unless absolute.
# A missing file is left out (with a warning), never a stop.
intro_image = ""      # png/jpg behind the intro card; any aspect, it fills the frame
outro_image = ""      # png/jpg behind the outro/stats card
logo = ""             # png with transparency, shown in a corner of the whole film
logo_position = "bottom-right"   # top-left | top-right | bottom-left | bottom-right
                                 # (top-right covers the killfeed)
logo_size = 0.12      # logo width as a share of the frame width
logo_opacity = 0.8    # 0.0-1.0

[clips]
pre_kill_seconds = 5.0    # lead-in before the first kill in a clip
post_kill_seconds = 3.0   # tail after the last kill
max_gap_seconds = 15.0    # kills closer than this are grouped into the same clip
max_candidates = 25       # hard limit going into the AI Director
