name: Bug report
description: Something doesn't work as the docs say it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Everything here is public.** Before you paste anything, replace:
        - your Windows user name in paths (`C:\Users\<you>\...`)
        - IP addresses and host names (`ssh_host`)
        - Steam IDs and player names

        Please don't attach demos or `config.toml`. If it's a security problem, use the **Security** tab instead.

        Problems right after a CS2 update are usually HLAE: see [troubleshooting](https://github.com/duffarn-dev/fragsmith/blob/main/docs/troubleshooting.md) first.
  - type: input
    id: version
    attributes:
      label: Fragsmith version
      description: "`python main.py --version`, or the commit (`git log -1 --oneline`)"
    validations:
      required: true
  - type: dropdown
    id: step
    attributes:
      label: Where did it go wrong?
      options:
        - setup / doctor
        - step 1 – parsing the demo
        - step 2 – picking highlights
        - step 3 – the Director (edit plan)
        - step 4 – rendering in CS2
        - step 5 – beat analysis
        - steps 6–7 – editing / the finished film
        - something else
    validations:
      required: false  # optional: GitHub then shows "None" instead of preselecting the first option
  - type: dropdown
    id: render_mode
    attributes:
      label: Render mode
      description: "`[render].mode` in config.toml"
      options:
        - local (one PC)
        - ssh (two PCs)
        - folder (two PCs, shared folder or USB)
        - didn't get to rendering
    validations:
      required: false  # optional: GitHub then shows "None" instead of preselecting the first option
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: The command you ran, what you expected, and what happened instead.
      placeholder: |
        python main.py run D:\demos\match.dem
        Expected: ...
        Got: ...
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `python main.py doctor`
      description: It shows your music folder, SSH host and key path. Replace your user name and IP first.
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: "`worker.log` for render problems, `runs/<id>/ffmpeg.log` or `report.md` for editing problems. The part around the error is enough."
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed user names, IPs, Steam IDs and player names from everything above.
          required: true
