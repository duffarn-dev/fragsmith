name: privacy

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # Pull requests: only the commits and lines the PR adds.
      # Everything else: every tracked file and every commit on the branch.
      - name: Check for personal data and secrets
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$BASE" ]; then
            python3 tools/privacy_check.py --range "$BASE..$HEAD"
          else
            python3 tools/privacy_check.py --tree
          fi
